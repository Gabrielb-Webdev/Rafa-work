<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bottleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f57c00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" fill="transparent"/>
  
  <!-- Botella de vitaminas -->
  <g>
    <!-- Tapa -->
    <ellipse cx="200" cy="100" rx="45" ry="15" fill="url(#capGrad)"/>
    <rect x="155" y="85" width="90" height="30" fill="url(#capGrad)"/>
    <ellipse cx="200" cy="85" rx="45" ry="15" fill="#fff"/>
    
    <!-- Cuello -->
    <rect x="175" y="115" width="50" height="25" fill="#ff9800"/>
    
    <!-- Cuerpo de la botella -->
    <ellipse cx="200" cy="140" rx="70" ry="25" fill="url(#bottleBg)"/>
    <rect x="130" y="140" width="140" height="150" fill="url(#bottleBg)"/>
    <ellipse cx="200" cy="290" rx="70" ry="25" fill="#e65100"/>
    
    <!-- Brillo -->
    <ellipse cx="160" cy="200" rx="20" ry="60" fill="rgba(255,255,255,0.3)"/>
    
    <!-- Etiqueta -->
    <rect x="145" y="180" width="110" height="70" rx="5" fill="#fff"/>
    <text x="200" y="210" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ff9800" text-anchor="middle">VIT</text>
    <text x="200" y="235" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ff9800" text-anchor="middle">C</text>
  </g>
  
  <!-- Píldoras alrededor -->
  <circle cx="280" cy="250" r="18" fill="#FFD700"/>
  <circle cx="310" cy="200" r="16" fill="#FFD700"/>
  <circle cx="120" cy="260" r="17" fill="#FFD700"/>
  <circle cx="90" cy="210" r="15" fill="#FFD700"/>
</svg>
