<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="pill1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pill2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4081;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="5" dy="10" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Píldora cyan grande -->
  <g filter="url(#shadow)">
    <ellipse cx="250" cy="200" rx="100" ry="40" fill="url(#pill1)" transform="rotate(-25 250 200)"/>
    <rect x="150" y="160" width="200" height="80" rx="40" fill="url(#pill1)" transform="rotate(-25 250 200)"/>
    <ellipse cx="250" cy="200" rx="100" ry="40" fill="rgba(255,255,255,0.3)" transform="rotate(-25 250 200)"/>
  </g>
  
  <!-- Píldora rosa -->
  <g filter="url(#shadow)">
    <ellipse cx="380" cy="300" rx="80" ry="35" fill="url(#pill2)" transform="rotate(15 380 300)"/>
    <rect x="300" y="265" width="160" height="70" rx="35" fill="url(#pill2)" transform="rotate(15 380 300)"/>
    <ellipse cx="380" cy="300" rx="80" ry="35" fill="rgba(255,255,255,0.25)" transform="rotate(15 380 300)"/>
  </g>
  
  <!-- Píldora cyan mediana -->
  <g filter="url(#shadow)">
    <ellipse cx="200" cy="400" rx="70" ry="30" fill="url(#pill1)" transform="rotate(45 200 400)"/>
    <rect x="130" y="370" width="140" height="60" rx="30" fill="url(#pill1)" transform="rotate(45 200 400)"/>
    <ellipse cx="200" cy="400" rx="70" ry="30" fill="rgba(255,255,255,0.3)" transform="rotate(45 200 400)"/>
  </g>
  
  <!-- Píldora rosa pequeña -->
  <g filter="url(#shadow)">
    <ellipse cx="450" cy="180" rx="60" ry="25" fill="url(#pill2)" transform="rotate(-35 450 180)"/>
    <rect x="390" y="155" width="120" height="50" rx="25" fill="url(#pill2)" transform="rotate(-35 450 180)"/>
  </g>
</svg>
